syntax = "proto3";
package maproto;
option java_package = "top.zedo.skin.v.proto";
option java_outer_classname = "SkinVProto";
// SkinFile schema from Emiria/protocol/db.proto; keep field numbers and types aligned.

message SkinFile{
	message MetaModeKey{
		bool locked = 1;  //历史原因，用于锁角度
		int32 angle = 2;
		bool use3d = 3;
		int32 keys = 4;
		float scale = 5;
		bool lock3d = 6;
		bool lockScale = 7;
		int32 judgePos = 8;
	}
	message MetaModeRing{
		bool lockDis = 1;
		int32 dis = 2;
	}
	message MetaModeTaiko{
		float scale = 1;
		int32 judgePos = 2;
		int32 judgeY = 3;
	}
	message Meta{
		string title = 1;
		string desc = 2;
		string creator = 3;
		string cover = 4;
		int32 mode = 5;
		int32 client = 6;
		oneof PerMode{
			MetaModeKey key = 7;
			MetaModeRing ring = 8;
			MetaModeTaiko taiko = 9;
		}

		string script = 23;
		int32 minver = 24;
		int32 feature = 25;
		bool free = 26;
		int32 skinid = 27;
		uint32 updated = 28;
	}
	message ModuleMeta{
		string creator = 1;
		string tags = 2;
		string desc = 3;
		int32 client = 4;
		uint32 time = 5;  //mod首次创建时间，不对外展示，用于内置的唯一标记
		bool disabled = 6;
		bool hideInEditor = 7;
	}
	enum ModuleCondFlag{
		Equal = 0;
		NotEqual = 1;
		Large = 2;
		Less = 3;
		Occur = 4;
	}
	message ModuleCondition{
		int32 source = 1;
		ModuleCondFlag flag = 2;
		oneof value{
			int32 valint = 3;
			double valdbl = 4;
			string valstr = 5;
		}
	}
	//这个定义固定，所以放pb
	enum ModuleParamAnchor{
		LeftTop = 0;
		Top = 1;
		RightTop = 2;
		Left = 3;
		Middle = 4;
		Right = 5;
		LeftBottom = 6;
		Bottom = 7;
		RightBottom = 8;
	}
	enum ModuleParamFill{
		FromLeft = 0;
		FromRight = 1;
	}
	enum ModuleParamUnit{
		Percent = 0;
		Unit = 1;
		PX = 2;
	}
	enum ModuleBlend{
		None = 0;
		Additive = 1;
	}
	message ModuleParam{
		// ModuleParamAnchor anchor = 1;
		ModuleParamAnchor pivot = 2;
		int32 rotate = 3;
		float x = 4;
		float y = 5;
		int32 alpha = 6;
		int32 layer = 7;
		int32 order = 8;
		ModuleParamUnit xu = 9;
		ModuleParamUnit yu = 10;
		float dx = 11;
		float dy = 12;
		ModuleParamUnit dxu = 13;
		ModuleParamUnit dyu = 14;
		bool anchorNote = 15;
		bool coexist = 16;  //共存，即触发器多次响应时的应对方式
	}
	message ModuleParamImage{
		string file = 1;
		int32 res = 2;  //内置资源, 对应
		int32 frames = 3;
		int32 fps = 4;
		int32 repeat = 5;  //循环次数
		float width = 6;
		float height = 7;
		bool flipx = 8;
		bool flipy = 9;
		repeated int32 slice = 10; //9宫区域，左上右下
		string filebase = 11;  //这2个用于帧动画，作为推算后的文件名拆分
		int32 filestart = 12;
		ModuleParamFill fill = 13;
		int32 valint = 14;  //预览时用的属性
		string color = 15;
		bool hide = 16; //frame的hideonfinish
		ModuleParamUnit wu = 17;
		ModuleParamUnit hu = 18;
		ModuleBlend blend = 19;
		bool nobreak = 20;
	}
	message ModuleParamSound{
		string file = 1;
		bool loop = 2;
		int32 volume = 3;
		bool hitsound = 4;
	}
	message ModuleParamText{
		string text = 1;
		int32 font = 2;  //对应SkinModuleFont
		string color = 3;
		float size = 4;
	}
	message ModuleParamImages{
		repeated ModuleParamImage items = 1;
	}
	message ModuleParamNotes {
		repeated ModuleParamImage images = 1;
	}
	message ModuleParamNumber{
		string file = 1;
		string text = 2;
		float height = 3;
		float padding = 4;
		string filebase = 5;
		int32 filestart = 6;
		int32 valint = 7;
	}
	message ModuleParamValue{
		float valF = 1;
		string valS = 2;
		bool valB = 3;
		float valMin = 4;
		float valMax = 5;
	}
	message ModuleAnimation{
		int32 type = 1;
		float startTime = 2;
		float endTime = 3;
		float fromVal0 = 4;
		float toVal0 = 5;
		float fromVal1 = 6;
		float toVal1 = 7;
		int32 repeat = 8;
		int32 repeatType = 9;
		float delay = 10;
		int32 ease = 11;
		int32 nid = 12; //内部属性，和record对应
	}
	message Module{
		int32 usage = 1; //对应SkinModuleUsage
		int32 type = 2;  //对应SkinModuleSubType
		ModuleMeta meta = 3;
		repeated ModuleCondition scenes = 4;
		repeated ModuleCondition triggers = 5;
		ModuleParam param = 6;
		oneof SubParam{
			ModuleParamImage image = 7;
			ModuleParamText text = 8;
			ModuleParamImages images = 9;
			ModuleParamNumber number = 10;
			ModuleParamNotes note = 11;
			ModuleParamValue value = 12;
			ModuleParamSound sound = 13;
		}
		repeated ModuleAnimation animations = 20;
	}
	message ModuleDef{
		int32 type = 1;
		ModuleParam param = 2;
	}
	message ComposerSetting{
		bool hideDef = 1;
		bool hideImg = 2;
		int32 usageFilter = 3;
	}
	Meta meta = 1;
	repeated int32 disabled = 2;  //禁用的默认组件id， 对应DefaultSkinModule
	repeated Module modules = 3;
	ComposerSetting settings = 4;
	repeated ModuleDef defs = 5;
}
